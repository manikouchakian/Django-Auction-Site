{% extends "auctions/layout.html" %}

{% block body %}
    <h2>Category: {{ category_name }}</h2>
    <ul>
        {% for listing in listings %}
            <li>
                <a href="{% url 'listing_detail' listing.id %}">
                    {{ listing.title }}
                </a>
                - {{ listing.starting_bid }} $ 
            </li>
        {% empty %}
            <li>No active listings in this Category!</li>
        {% endfor %}
    </ul>
{% endblock %}
