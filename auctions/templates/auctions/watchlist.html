{% extends "auctions/layout.html" %}

{% block body %}
    <h2>My Watchlist</h2>
    <ul>
        {% for listing in listings %}
            <li>
                <a href="{% url 'listing_detail' listing.id %}">
                    {{ listing.title }}
                </a>
                - {{ listing.starting_bid }}
            </li>
        {% empty %}
            <li style="color: red;">Your Watchlist is empty!</li>
        {% endfor %}
    </ul>
{% endblock %}
